schema: 1
story: '5.1'
gate: PASS
status_reason: >
  Todos os 7 ACs verificados e implementados corretamente. Auth guard presente em ambas as
  Server Actions, RLS conforme AC6 (sem filtro explícito admin_user_id), Server Action inline
  com redirect() para mark-as-viewed. 142 testes passando (24 arquivos; 5 novos).
  Quatro observações de baixa severidade documentadas como débito técnico sem impacto funcional.
reviewer: Quinn
updated: '2026-05-25T21:35:00Z'

top_issues:
  - id: CONCERN-001
    severity: low
    finding: >
      Links "Ver" (orders/page.tsx:102) e paginação "Anterior"/"Próxima" usam <a href> em vez
      de <Link> do Next.js. Lint não flagrou (rotas dinâmicas). Funcional, mas perde prefetch
      e client-side navigation.
    suggested_action: >
      Em revisão futura, converter <a href={`/admin/orders/${row.id}`}> e links de paginação
      para <Link href={...}> do next/link.

  - id: CONCERN-002
    severity: low
    finding: >
      formatDate() duplicada em orders/page.tsx:9-13 e orders/[id]/page.tsx:7-11.
      Código idêntico nos dois arquivos.
    suggested_action: >
      Extrair para lib/utils/format-date.ts e importar nos dois files.

  - id: CONCERN-003
    severity: low
    finding: >
      handleMarkViewed (orders/[id]/page.tsx:32-36) silencia erro de markOrderViewed
      e sempre chama redirect(). Se DB update falhar, usuário retorna à mesma
      página sem feedback de erro.
    suggested_action: >
      Para MVP admin (erros raros, admin já autenticado) é aceitável. Em revisão futura,
      capturar result.ok e mostrar toast de erro antes do redirect.

  - id: CONCERN-004
    severity: low
    finding: >
      markOrderViewed usa apenas .eq('id', orderId) sem double-check .eq('admin_user_id', user.id)
      além do RLS. Diferente do padrão usado em markNotificationRead (Story 4.6).
      Story AC6 explicitamente permite, mas gera inconsistência de padrão.
    suggested_action: >
      Em padronização futura, decidir se todas as mutations seguem o padrão defense-in-depth
      de Story 4.6 ou se confiam exclusivamente no RLS (ambas as abordagens são corretas).

