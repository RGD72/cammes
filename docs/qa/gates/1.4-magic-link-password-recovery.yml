security_highlights:
  - "Anti-enumeration: requestPasswordResetAction sempre retorna sucesso independente do e-mail"
  - "Session fixation prevention: signOut() chamado antes do redirect em updatePasswordAction"
  - "PKCE: exchangeCodeForSession(code) server-side — não expõe tokens no cliente"
  - "Origin: derivado do header Origin (Server Action) ou NEXT_PUBLIC_SITE_URL — sem hard-code"
  - "Middleware: public auth routes (/recover-password, /reset-password, /auth/*) liberadas antes dos guards"
