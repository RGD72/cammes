issues:
  - id: UX-001
    severity: low
    category: code
    description: >
      recover-password-form.tsx permite submissão com e-mail vazio — o botão fica habilitado
      quando o usuário não digitou nada (emailError é '' falsy). O guard validateEmail só
      popula emailError quando há valor não-vazio. A ação server-side lida via anti-enumeration,
      mas o UX poderia ser aprimorado desabilitando o botão quando o campo estiver vazio.
    recommendation: >
      Adicionar validação `|| !emailValue` no disabled do botão, mantendo emailValue como
      estado local controlado, ou usar o evento blur para forçar validate antes do submit.
    carry_forward: true

  - id: SEC-003
    severity: low
    category: security
    description: >
      Parâmetro `next` na rota /auth/callback não é validado contra uma allowlist de rotas
      internas. Um ator mal-intencionado poderia construir uma URL /auth/callback?next=/some-path
      e ser redirecionado após autenticação. O middleware protege todas as rotas com guard de sessão,
      mitigando o risco, e `${origin}${next}` não possibilita open redirect absoluto.
    recommendation: >
      Adicionar validação: `const allowedPaths = ['/brands', '/reset-password', '/admin']`
      e checar que `next.startsWith('/')` + está na allowlist antes de redirecionar.
      Ou sanitizar rejeitando qualquer `next` que não comece com '/'.
    carry_forward: true

