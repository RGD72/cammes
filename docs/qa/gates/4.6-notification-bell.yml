schema: 1
story: '4.6'
gate: PASS
status_reason: >
  Todos os 9 ACs verificados e implementados corretamente. Segurança (auth guard + RLS + double-check
  admin_user_id no UPDATE), badge com contagem, dropdown nativo, polling 30s, mark-read individual
  e em lote, reactivity via router.refresh(). 137 testes passando (23 arquivos). Cinco observações
  de baixa severidade documentadas como debt técnico sem impacto funcional.
reviewer: Quinn
updated: '2026-05-25T20:08:00Z'

top_issues:
  - id: MNT-005
    severity: low
    finding: >
      Links de notificação implementados via router.push() em onClick, não como <a href>.
      Impede Ctrl+Click para abrir em nova aba e não funciona sem JavaScript.
    suggested_action: >
      Para MVP admin (JS sempre disponível) é aceitável. Em revisão futura, considerar
      wrapper <Link href> do Next.js com onClick para prevenção de default quando
      mark-read estiver pendente.

  - id: TEST-002
    severity: low
    finding: >
      Ausência de teste negativo para markNotificationRead não autenticado (N-NOTIF-2).
      O padrão está coberto em N-NOTIF-1 (getNotifications), mas mark-read não tem
      teste de path não autenticado explícito.
    suggested_action: >
      Adicionar: it('N-NOTIF-2: não autenticado → markNotificationRead retorna PERMISSION_DENIED')
      para cobertura simétrica com getNotifications.

  - id: TEST-003
    severity: low
    finding: >
      Ausência de testes para caminho de erro de banco (internalError) em getNotifications,
      markNotificationRead e markAllNotificationsRead.
    suggested_action: >
      Adicionar teste com mock que retorna { error: { message: 'DB error' } } e verificar
      que result.ok === false e result.error.code === 'INTERNAL'.

  - id: MNT-006
    severity: low
    finding: >
      relativeTime() retorna strings negativas (ex: "-5min atrás") para datas futuras.
      Improvável em produção mas tecnicamente incorreto.
    suggested_action: >
      Adicionar: if (diff < 0) return 'agora' como primeira linha da função relativeTime.

  - id: MNT-007
    severity: low
    finding: >
      markNotificationRead recebe id: string sem validação de formato UUID antes
      do uso em query. RLS protege contra abuso, mas validação defensiva seria melhor.
    suggested_action: >
      Adicionar validação: if (!id || typeof id !== 'string') return permissionDenied()
      ou usar z.string().uuid().safeParse(id).

