top_issues:
  - id: TEST-001
    severity: low
    finding: >
      getProductsForReview não possui testes unitários. A função executa uma query simples
      (select + order) e o comportamento correto é garantido pelo schema RLS da Story 2.5,
      mas ausência de cobertura é nota válida para sprints futuros.
    suggested_action: >
      Adicionar teste P-GR-1 verificando que apenas produtos da marca são retornados
      e que a ordenação por extraction_confidence ASC está correta (null last).
      Baixa prioridade — AC9 não exige este teste.

  - id: MNT-001
    severity: low
    finding: >
      Link "Ir para publicação" aponta para /admin/brands/${brandId} (tela da marca)
      em vez de uma rota de publicação dedicada (/admin/brands/${brandId}/publish).
      O AC6 aceita placeholder para esta story.
    suggested_action: >
      Atualizar para /admin/brands/${brandId}/publish quando Story 3.3
      (Estado Publicado / Não Publicado) for implementada.

  - id: ARCH-001
    severity: low
    finding: >
      Todos os produtos da marca são carregados no SSR e filtrados 100% client-side.
      Para catálogos típicos (50-200 produtos) o impacto é mínimo. Para volumes
      maiores (>500 produtos), o tempo de carregamento inicial e o payload SSR
      podem crescer.
    suggested_action: >
      Se catálogos com >500 produtos tornarem-se comuns, considerar paginação
      server-side ou cursor-based loading em sprint futuro. Não bloqueia MVP.

