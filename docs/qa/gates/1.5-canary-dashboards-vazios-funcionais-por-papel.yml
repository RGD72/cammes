top_issues:
  - id: MNT-001
    severity: low
    finding: >
      Links da sidebar do admin (/admin/brands, /admin/orders, /admin/settings) levam a rotas
      ainda não implementadas — o admin recebe 404 ao clicar. Comportamento esperado e documentado
      no Scope OUT da story (Epic 2/3), mas o estado visual não indica que os links são placeholder.
    suggested_action: >
      Adicionar atributo aria-disabled ou estilo visual de "em breve" nos links do sidebar
      ao implementar Epic 2. Não necessário nesta story — scope OUT explícito.

  - id: MNT-002
    severity: low
    finding: >
      BrandsLayout e AdminPage fazem queries separadas a users_profile por request.
      Para MVP com volume baixo é aceitável — documentado em Dev Notes como trade-off consciente.
    suggested_action: >
      Considerar React cache() ou middleware passando role/name via header para eliminar
      a query duplicada em alta escala. Avaliação pós-MVP.

