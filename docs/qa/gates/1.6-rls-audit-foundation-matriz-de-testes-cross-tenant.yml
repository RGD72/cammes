top_issues:
  - id: RLS-001
    severity: low
    finding: >
      N-UBA-1 e N-UBA-2 usam expect(data).toBeNull() para INSERTs bloqueados por RLS.
      PostgREST retorna erro (RLS violation) para INSERTs, tornando a assertion correta hoje.
      Se o comportamento do PostgREST mudar para retornar [] sem erro, o teste passaria
      incorretamente. O assert de error cobre o caso crítico.
    suggested_action: >
      Manter como está — o assert expect(error).not.toBeNull() é o que garante a semântica.
      Se futuramente PostgREST mudar o comportamento, o assert de error ainda cobre.
      Aceitável para MVP.

  - id: RLS-002
    severity: low
    finding: >
      users_profile não tem integration tests dedicados (apenas unit coverage indireta).
      Escopo OUT da story é explícito sobre isso — apenas brands e user_brand_access.
    suggested_action: >
      Adicionar tests/integration/rls/users-profile.test.ts em story futura ao expandir
      permissões de perfil (Epic 2+). Não necessário nesta story.

positive_findings:
  - id: SEC-FIND-001
    severity: critical_fix
    finding: >
      Integration tests descobriram 3 ciclos de recursão infinita nas policies RLS da Story 1.2
      que tornavam TODAS as queries nas tabelas brands e user_brand_access não funcionais para
      usuários autenticados. O bug existia silenciosamente desde a Story 1.2.
    resolution: >
      Corrigido via migration 20260521000001_rls_fix_infinite_recursion.sql com 2 funções
      SECURITY DEFINER: current_user_is_admin() e user_has_active_brand_access().
      Ambas usam SET search_path = '' e auth.uid() — security semantics preservadas.
      Este é exatamente o valor de integration tests de RLS: detectar bugs que code review
      não captura.

  - id: ARCH-FIND-001
    severity: info
    finding: >
      UPSERT em grantAccess (onConflict: user_id,brand_id) é solução correta para
      re-concessão de acesso revogado — evita violação de PK na re-grant sequence
      testada em N-BR-5 → P-BR-5.

