status_reason: >
  Todos os 10 ACs verificados e implementados corretamente. Segurança (auth guard + RLS),
  cache de PDF, redirect 302, bucket privado e 131 testes passando. Três observações de baixa
  severidade documentadas como debt técnico sem impacto funcional.
reviewer: Quinn
updated: '2026-05-25T11:10:00Z'

top_issues:
  - id: MNT-003
    severity: low
    finding: >
      Header da coluna "Qtd" renderiza como "QTD" (via textTransform: uppercase), mas AC3
      especifica "QUANTIDADE". Divergência cosmética de label.
    suggested_action: >
      Substituir "Qtd" por "Quantidade" em lib/pdf/order-pdf.tsx linha 178 para conformidade
      exata com AC3.

  - id: TEST-001
    severity: low
    finding: >
      Teste P-PDF-1 verifica que storage.from('orders') foi chamado, mas não asserta que
      upload() foi efetivamente invocado com os argumentos corretos.
    suggested_action: >
      Adicionar: expect(storageMock.upload).toHaveBeenCalledWith(pdfPath, expect.any(Buffer), ...)
      para cobertura mais explícita do caminho de upload.

  - id: MNT-004
    severity: low
    finding: >
      formatDate em lib/pdf/order-pdf.tsx usa new Date(iso) sem timezone explícito,
      aplicando TZ local do servidor. Em deploy não-BRT (ex. UTC), datas aparecerão
      com horário deslocado no PDF.
    suggested_action: >
      Usar Intl.DateTimeFormat com timeZone: 'America/Sao_Paulo' para consistência,
      ou alinhar com comportamento aceitável no PRD.

