top_issues:
  - id: 'PERF-001'
    severity: medium
    finding: >
      getDistinctEventTypes() executa SELECT event_type sem LIMIT e sem DISTINCT no banco.
      Deduplicação acontece em JS, carregando potencialmente todos os logs para popular um dropdown.
      Com alto volume de registros (>100k logs), isso pode ser lento.
    suggested_action: >
      Usar query nativa com DISTINCT: criar RPC Postgres ou substituir por
      SELECT DISTINCT event_type FROM audit_logs ORDER BY event_type.
      Alternativa imediata: adicionar .limit(5000) como teto.

  - id: 'SEC-001'
    severity: medium
    finding: >
      getAuditLogs(), getAuditLogsForCsv() e getDistinctEventTypes() verificam apenas !user (autenticado),
      sem verificar explicitamente se role = 'admin' na camada de aplicação.
      A defesa principal é a RLS (audit_admin_read), mas não há fallback de defense-in-depth.
      Se RLS for desabilitada acidentalmente (ex: bug de migration), qualquer usuário autenticado
      leria todos os logs de auditoria via /api/admin/audit/csv.
    suggested_action: >
      Adicionar verificação explícita de role admin nas funções de leitura de audit_logs,
      similar ao padrão usado em lib/orders/admin-actions.ts com permissionDenied().
      Consultar users_profile.role após getUser() e retornar permissionDenied() se role != 'admin'.

