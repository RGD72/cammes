story: '3.2'
gate: CONCERNS
status_reason: >
  Todos os 6 ACs e quality gates passam (lint/typecheck/83 testes).
  Uma preocupação média: após arrastar um card, filteredProducts re-aplica o sort
  por extraction_confidence, revertendo a ordem visual imediatamente — embora o
  display_order seja persistido corretamente no banco. Recomenda-se corrigir em sprint
  seguinte desacoplando o sort de confiança do estado de reordenação DnD.
reviewer: 'Quinn'
updated: '2026-05-22T23:57:30Z'
top_issues:
  - id: 'MNT-001'
    severity: medium
    finding: >
      filteredProducts re-ordena por extraction_confidence após cada arrayMove,
      fazendo os cards voltarem visualmente à ordem pré-drag mesmo após uma
      operação de DnD bem-sucedida. O display_order é persistido corretamente
      no banco, mas o feedback visual otimista (AC2 — "estado local reflete a
      nova ordem imediatamente") não se materializa na tela até o próximo reload.
    suggested_action: >
      Separar a lógica de ordenação em dois passos: (1) aplicar display_order
      como critério de sort primário quando disponível, desativando o sort por
      confiança no modo flat após o primeiro DnD; ou (2) manter um estado
      separado "draggedOrder" que sobrepõe o sort por confiança. Toast "Ordem salva"
      mitiga parcialmente o problema (usuário recebe confirmação), mas a UX ainda é
      confusa. Prioridade: antes da Story 3.5 (vitrine do cliente).
