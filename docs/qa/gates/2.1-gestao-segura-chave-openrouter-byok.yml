top_issues:
  - id: TEST-001
    severity: low
    finding: >
      Botão "Testar conexão" usa canTest = keyInput.length > 0, ignorando hasKey.
      A spec (Task 4.1) diz que deve ser habilitado quando hasKey=true mesmo com campo vazio,
      para permitir testar a chave já salva. Para implementar isso seria necessária uma Server
      Action separada (testSavedOpenRouterKey) que lê, descriptografa e testa internamente.
    suggested_action: >
      Story futura ou task adicional: adicionar testSavedOpenRouterKey() Server Action e
      atualizar lógica do botão para enabled when (keyInput.length > 0 OR hasKey).
      Não bloqueia MVP — usuário pode re-inserir a chave e testar.

  - id: UX-001
    severity: low
    finding: >
      Botão "Salvar chave" habilitado quando keyInput="" e hasKey=true. Clicá-lo retorna
      "Chave não pode ser vazia." — comportamento inesperado. Idealmente desabilitar
      quando keyInput="" independente de hasKey.
    suggested_action: >
      Simplificar condição: disabled={isPending || keyInput.length === 0}.
      A model é salva automaticamente via handleModelChange — o save button é exclusivo para chave.

positive_findings:
  - id: SEC-FIND-001
    severity: info
    finding: >
      Implementação pgcrypto via DB functions SECURITY DEFINER com SET search_path = '' é
      tecnicamente correta e segura. O segredo nunca aparece como texto literal no SQL —
      sempre como bind parameter ($2) via supabase.rpc(). Nenhum risco de SQL injection
      ou log poisoning da env var.

  - id: SEC-FIND-002
    severity: info
    finding: >
      Server Actions com 'use server' e uso correto de service role client apenas no servidor.
      SUPABASE_SERVICE_ROLE_KEY não tem prefixo NEXT_PUBLIC_ e createServiceRoleSupabaseClient
      está em lib/supabase/admin.ts (sem 'use client'). Boundary correto.

  - id: ARCH-FIND-001
    severity: info
    finding: >
      AdminNav extraído como Client Component separado (components/admin/admin-nav.tsx) para
      suportar usePathname() mantendo app/admin/layout.tsx como Server Component.
      Padrão correto para Next.js App Router.

