schema: 1
story: '1.3'
gate: CONCERNS
status_reason: >
  Implementação sólida e todos os ACs funcionalmente satisfeitos. Três issues
  não-bloqueantes identificados: referência ARIA quebrada, ausência de validação
  inline por campo, e rate limiter sem limpeza de memória.
reviewer: Quinn
updated: '2026-05-21T13:20:00Z'
top_issues:
  - id: 'A11Y-001'
    severity: low
    finding: >
      aria-describedby="form-error" no campo de e-mail referencia um id inexistente.
      O div de erro usa role="alert" (anuncia corretamente via live region) mas não
      tem id="form-error", quebrando a associação ARIA descritiva.
    suggested_action: >
      Adicionar id="form-error" ao div de erro em login-form.tsx para que
      aria-describedby funcione corretamente em leitores de tela.

  - id: 'AC1-001'
    severity: medium
    finding: >
      AC1 descreve "validações inline (campo obrigatório, formato de e-mail)", mas
      o formulário usa noValidate desabilitando a validação nativa do browser.
      Validação só ocorre via resposta do servidor (mensagem global, não por campo).
    suggested_action: >
      Implementar validação client-side inline em Story 1.4 ou 1.5: mostrar
      mensagem por campo (ex: "E-mail inválido" abaixo do campo de e-mail) sem
      esperar resposta do servidor.

  - id: 'SEC-002'
    severity: medium
    finding: >
      O Map de rate limiting em lib/auth/rate-limit.ts nunca remove entradas.
      IPs com janela expirada permanecem no Map indefinidamente. Em produção com
      alto volume de IPs únicos, isso pode causar crescimento ilimitado de memória.
    suggested_action: >
      Adicionar função de limpeza de entradas expiradas (cleanup sweep periódico),
      ou substituir por Vercel KV / Upstash antes de go-live conforme tech debt
      já documentado.

