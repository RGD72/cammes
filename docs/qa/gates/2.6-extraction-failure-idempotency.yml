top_issues:
  - id: TEST-001
    severity: low
    finding: >
      P-RT-3 ("cria novo job com status queued") não verifica explicitamente
      que o payload do INSERT inclui ou omite o campo status. O comportamento
      correto é garantido pelo DEFAULT 'queued' na migration (confirmado em
      20260522000002_extraction_jobs.sql:8), mas o teste não cobre esta
      invariante explicitamente.
    suggested_action: >
      Em sprint futuro, adicionar assertion no mock do INSERT verificando
      que o chamador não passa status incorreto — por exemplo,
      asserting que o insert não inclui status='running' ou 'failed'.
      Baixa prioridade: DB default é o mecanismo correto aqui.

  - id: REL-001
    severity: low
    finding: >
      Se o dispatch da Edge Function falha (rede indisponível), o fluxo de
      retrigger realiza rollback correto (deleta novo job, reverte catalog
      para awaiting_extraction), mas o job anterior permanece 'superseded'.
      O admin não pode usar "Tentar novamente" novamente — deve usar o botão
      "Iniciar extração" na tela da marca (ExtractionEstimateCard). A UX
      de erro retornado ('Não foi possível iniciar a re-extração.') não
      comunica isso ao admin.
    suggested_action: >
      Considerar melhorar a mensagem de erro neste cenário para orientar o
      admin a voltar para a tela da marca e usar "Iniciar extração".
      Alternativa: desfazer o supersede do job anterior no rollback.
      Escopo Story 2.7 ou QA backlog.

