  - id: 'TEST-001'
    severity: low
    finding: 'getConsentHistory() não possui testes unitários — função exportada e usável por componentes futuros, mas sem cobertura.'
    suggested_action: 'Adicionar 2 testes: P-HIST-1 (retorna histórico do usuário autenticado), N-HIST-1 (retorna PERMISSION_DENIED quando não autenticado).'
