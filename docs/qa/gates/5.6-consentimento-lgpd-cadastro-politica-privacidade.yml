    severity: medium
    finding: 'UPDATE users_profile.consented_version em recordConsent() não verifica o resultado — se falhar após INSERT bem-sucedido em consent_log, o usuário será redirecionado repetidamente para /consent/accept mesmo com aceite auditado.'
